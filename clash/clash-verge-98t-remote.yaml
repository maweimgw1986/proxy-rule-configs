# Clash Verge 远程分流模板；机场订阅仅写入客户端的订阅扩展配置。
port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: true
bind-address: '*'
lan-allowed-ips:
- 127.0.0.0/8
- ::1/128
- 100.64.0.0/10
mode: rule
log-level: info
ipv6: false
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.ts.net'
  - captive.apple.com
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
proxy-groups:
- name: 代理
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 台湾节点
  - 日本节点
  - 新加坡节点
  - 美国节点
  - DIRECT
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 50
  filter: ^(?!.*(网易|墨鱼|剩余|重置|到期|官网)).*$
  include-all-providers: true
  proxies:
  - REJECT
- name: 兜底分流
  type: select
  proxies:
  - 代理
  - DIRECT
  - 香港节点
  - 台湾节点
  - 日本节点
  - 新加坡节点
  - 美国节点
- name: 香港节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  filter: 🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港
  include-all-providers: true
  proxies:
  - REJECT
- name: 台湾节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  filter: 🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北
  include-all-providers: true
  proxies:
  - REJECT
- name: 日本节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  filter: 🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|日
  include-all-providers: true
  proxies:
  - REJECT
- name: 新加坡节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  filter: 🇸🇬|SG|Sing|sing|新加坡|狮城|沪新|京新
  include-all-providers: true
  proxies:
  - REJECT
- name: 美国节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  filter: 🇺🇸|US|USA|America|america|United States|美国|洛杉矶|硅谷|波特兰|美
  include-all-providers: true
  proxies:
  - REJECT
